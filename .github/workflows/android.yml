name: Build APK

# Builds a debug APK in the cloud and publishes it as a GitHub Release
# (tag = build number = versionCode) so the app's in-app updater can find it.
on:
  push:
  workflow_dispatch:

jobs:
  windows_profiles:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows profile client
        shell: pwsh
        run: dotnet publish pc/tuning_lab/CarrotTuningLab.csproj -c Release -r win-x64 --self-contained true -o windows-output -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
      - name: Verify portable profile roundtrips and settings references
        shell: pwsh
        run: |
          $taskWindowsTest = Start-Process -FilePath (Resolve-Path './windows-output/CarrotTuningLab.exe') -ArgumentList @('--self-test', 'windows-profile-tests.json') -WindowStyle Hidden -Wait -PassThru
          if ($taskWindowsTest.ExitCode -ne 0) { throw 'Windows client test process failed' }
          if (-not (Get-Content windows-profile-tests.json -Raw | ConvertFrom-Json).passed) { throw 'Windows profile test failed' }
          Compress-Archive -Path windows-output/* -DestinationPath CarrotTuningLab-Windows-1.2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsTuningLab
          path: |
            CarrotTuningLab-Windows-1.2.zip
            windows-profile-tests.json
  build:
    needs: windows_profiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test PC receiver
        run: |
          python -m pip install -r pc/requirements.txt
          python -m unittest discover -s pc -p 'test_*.py' -v

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build debug APK
        run: >
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CarrotHud-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - uses: actions/download-artifact@v4
        with:
          name: WindowsTuningLab
          path: windows-release

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Carrot HUD build ${{ github.run_number }} (versionCode ${{ github.run_number }})."
          files: |
            app/build/outputs/apk/debug/*.apk
            windows-release/CarrotTuningLab-Windows-1.2.zip
