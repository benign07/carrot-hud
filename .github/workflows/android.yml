name: Build APK

# Builds a debug APK in the cloud and publishes it as a GitHub Release
# (tag = build number = versionCode) so the app's in-app updater can find it.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build debug APK
        run: >
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CarrotHud-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Carrot HUD build ${{ github.run_number }} (versionCode ${{ github.run_number }})."
          files: app/build/outputs/apk/debug/*.apk
