plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.carrot.hud'
    compileSdk 34

    defaultConfig {
        applicationId 'com.carrot.hud'
        minSdk 26
        targetSdk 33
        versionCode ((project.findProperty("versionCode") ?: "1").toString().toInteger())
        versionName ((project.findProperty("versionName") ?: "1.0").toString())
    }

    signingConfigs {
        // Fixed keystore so every build (CI included) is signed with the SAME
        // key -> in-app updates install over the previous version cleanly.
        fixed {
            storeFile file("keystore.p12")
            storePassword "android"
            keyAlias "carrothud"
            keyPassword "android"
            storeType "PKCS12"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
